<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Vokasi UNAIR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <div class="text-center mb-8">
            <img src="https://vokasi.unair.ac.id/wp-content/uploads/2021/04/Logo-Vokasi-UNAIR-2.png" alt="Logo Vokasi" class="h-16 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Sistem Informasi</h2>
            <p class="text-gray-600">Fakultas Vokasi UNAIR</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="loginEmail">Email</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="loginEmail" type="email" placeholder="admin@vokasi.com" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="loginPassword">Password</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="loginPassword" type="password" placeholder="********" required>
            </div>
            <div class="flex items-center justify-between">
                <button id="btnLogin" class="bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full flex items-center justify-center transition-colors" type="submit">
                    <i class="fas fa-sign-in-alt mr-2"></i> Masuk Sistem
                </button>
            </div>
        </form>
    </div>

    <script>
        // MASUKKAN KUNCI SUPABASE ANDA DI SINI
        const SUPABASE_URL = 'https://qfefcefenpmzpekejipv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NA2J67_E_KUKyuvsnegrHQ_2mcENfzI';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(msg, type = 'error') {
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            toast.className = `toast-enter ${color} text-white px-4 py-3 rounded-lg shadow-lg flex items-center max-w-sm pointer-events-auto`;
            toast.innerHTML = `<span class="text-sm font-medium">${msg}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('btnLogin');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            btn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (authError) throw authError;
                
                const { data: userData, error: userError } = await supabaseClient
                    .from('pengguna')
                    .select('*')
                    .eq('username', email.toLowerCase())
                    .single();
                    
                if (userError) throw new Error("Data akses pengguna tidak ditemukan di database.");

                sessionStorage.setItem('vokasi_user', JSON.stringify(userData));
                window.location.href = "dashboard.html";
                
            } catch (err) {
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Masuk Sistem';
                btn.disabled = false;
                showToast(err.message === 'Invalid login credentials' ? 'Email atau Password salah!' : err.message);
            }
        };

        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && sessionStorage.getItem('vokasi_user')) {
                window.location.href = "dashboard.html";
            }
        };
    </script>
</body>
</html>
