<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistem Informasi Vokasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .toast-enter { animation: toastIn 0.3s ease-out forwards; }
        .toast-exit { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal flex h-screen overflow-hidden">

    <!-- Notifikasi Toast -->
    <div id="toastContainer" class="fixed bottom-4 right-4 flex flex-col gap-2 z-[9999]"></div>

    <!-- Sidebar -->
    <div class="bg-blue-800 shadow-xl h-full w-64 text-white flex flex-col transition-all duration-300 z-20">
        <div class="p-6 text-center border-b border-blue-700">
            <h1 class="text-2xl font-bold"><i class="fas fa-university mr-2"></i>Vokasi UNAIR</h1>
            <p class="text-blue-300 text-sm mt-1">Sistem Manajemen</p>
        </div>
        <nav class="flex-grow p-4 overflow-y-auto">
            <a href="#" onclick="showSection('dashboard')" class="block py-3 px-4 rounded transition bg-blue-900 mb-2"><i class="fas fa-home mr-3"></i>Dashboard</a>
            <a href="#" onclick="showSection('ruangan')" class="block py-3 px-4 rounded transition hover:bg-blue-700 mb-2"><i class="fas fa-door-open mr-3"></i>Data Ruangan</a>
            <!-- Menu lain bisa ditambahkan di sini -->
        </nav>
        <div class="p-4 border-t border-blue-700">
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                <i class="fas fa-sign-out-alt mr-2"></i>Keluar
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
            <h2 class="text-xl font-semibold text-gray-800" id="headerTitle">Dashboard</h2>
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-800 font-bold mr-3">
                    <i class="fas fa-user"></i>
                </div>
                <div class="text-sm">
                    <p class="font-bold text-gray-800" id="userDisplayName">Memuat...</p>
                    <p class="text-gray-500 text-xs" id="userRoleDisplay">Administrator</p>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            
            <!-- Section: Dashboard -->
            <div id="section-dashboard" class="content-section">
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                    <h3 class="text-lg font-bold mb-2">Selamat Datang di Sistem Vokasi!</h3>
                    <p class="text-gray-600">Pilih menu di sebelah kiri untuk mengelola data operasional fakultas.</p>
                </div>
            </div>

            <!-- Section: Ruangan -->
            <div id="section-ruangan" class="content-section hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Manajemen Ruangan</h3>
                    <button onclick="bukaModalRuangan()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow transition">
                        <i class="fas fa-plus mr-2"></i>Tambah Ruangan
                    </button>
                </div>
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full bg-white">
                            <thead class="bg-gray-800 text-white">
                                <tr>
                                    <th class="px-4 py-3 text-center w-16">No</th>
                                    <th class="px-4 py-3 text-left">Nama Ruangan</th>
                                    <th class="px-4 py-3 text-center">Kapasitas</th>
                                    <th class="px-4 py-3 text-left">Fasilitas</th>
                                    <th class="px-4 py-3 text-center w-48">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyRuangan" class="text-gray-700">
                                <tr><td colspan="5" class="text-center py-4">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal Form Ruangan -->
    <div id="modalRuangan" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="bg-blue-800 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg" id="modalRuanganTitle">Tambah Ruangan</h3>
                <button onclick="tutupModalRuangan()" class="text-gray-300 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6">
                <input type="hidden" id="ruangId">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama Ruangan</label>
                    <input type="text" id="ruangNama" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Ruang Rapat Lt. 2">
                </div>
                <!-- Tambahan Form Kapasitas & Fasilitas -->
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Kapasitas (Orang)</label>
                    <input type="number" id="ruangKapasitas" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: 40" value="0">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Fasilitas</label>
                    <textarea id="ruangFasilitas" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Contoh: AC, Proyektor, Sound System"></textarea>
                </div>
                
                <div class="flex justify-end gap-2">
                    <button onclick="tutupModalRuangan()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded transition">Batal</button>
                    <button onclick="simpanRuangan()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition"><i class="fas fa-save mr-2"></i>Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- KONFIGURASI SUPABASE (Wajib Diisi) -->
    <script>
        const SUPABASE_URL = 'https://qfefcefenpmzpekejipv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NA2J67_E_KUKyuvsnegrHQ_2mcENfzI';
        
        // Inisialisasi menggunakan supabaseClient agar tidak konflik
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- SISTEM NOTIFIKASI TOAST ---
        function showToast(msg, type = 'error') {
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            toast.className = `toast-enter ${color} text-white px-4 py-3 rounded-lg shadow-lg flex items-center min-w-[250px]`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-3 text-lg"></i><span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => { 
                toast.classList.replace('toast-enter', 'toast-exit'); 
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        // --- CEK SESI & AUTENTIKASI ---
        window.onload = async function() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error || !session) {
                // Jika tidak ada sesi valid, lempar kembali ke halaman login
                window.location.href = "index.html";
                return;
            }

            // Tampilkan data profil admin
            const userData = JSON.parse(sessionStorage.getItem('vokasi_user') || '{}');
            document.getElementById('userDisplayName').innerText = userData.name || session.user.email;
            document.getElementById('userRoleDisplay').innerText = userData.roleName || 'Administrator';
            
            // Muat data awal
            loadRuangan();
        };

        // --- FUNGSI LOGOUT ---
        async function logout() {
            await supabaseClient.auth.signOut();
            sessionStorage.removeItem('vokasi_user');
            window.location.href = "index.html";
        }

        // --- NAVIGASI ANTAR MENU ---
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('section-' + sectionId).classList.remove('hidden');
            
            const titles = { 'dashboard': 'Dashboard', 'ruangan': 'Manajemen Ruangan' };
            document.getElementById('headerTitle').innerText = titles[sectionId] || 'Dashboard';
            
            if (sectionId === 'ruangan') loadRuangan();
        }

        // --- MODAL RUANGAN ---
        function bukaModalRuangan() {
            document.getElementById('ruangId').value = '';
            document.getElementById('ruangNama').value = '';
            document.getElementById('ruangKapasitas').value = '0';
            document.getElementById('ruangFasilitas').value = '';
            document.getElementById('modalRuanganTitle').innerText = 'Tambah Ruangan';
            document.getElementById('modalRuangan').classList.remove('hidden');
            document.getElementById('modalRuangan').classList.add('flex');
        }

        function tutupModalRuangan() {
            document.getElementById('modalRuangan').classList.add('hidden');
            document.getElementById('modalRuangan').classList.remove('flex');
        }

        // --- CRUD RUANGAN ---
        
        // 1. Muat (Read) Data
        async function loadRuangan() {
            const tbody = document.getElementById('tbodyRuangan');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</td></tr>';
            
            const { data, error } = await supabaseClient.from('ruangan').select('*').order('id', { ascending: false });
            
            if (error) {
                showToast('Gagal memuat data ruangan', 'error');
                return;
            }
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">Belum ada data ruangan</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach((r, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="px-4 py-3 text-center">${index + 1}</td>
                        <td class="px-4 py-3 font-medium text-gray-800">${r.nama_ruangan}</td>
                        <td class="px-4 py-3 text-center text-sm">${r.kapasitas ? r.kapasitas + ' Orang' : '-'}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${r.fasilitas || '-'}</td>
                        <td class="px-4 py-3 text-center">
                            <button onclick="editRuangan(${r.id})" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-xs mr-2 transition shadow-sm"><i class="fas fa-edit"></i> Edit</button>
                            <button onclick="hapusRuangan(${r.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition shadow-sm"><i class="fas fa-trash"></i> Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2. Simpan (Create & Update) Data
        async function simpanRuangan() {
            const id = document.getElementById('ruangId').value;
            const nama = document.getElementById('ruangNama').value.trim();
            const kapasitas = document.getElementById('ruangKapasitas').value;
            const fasilitas = document.getElementById('ruangFasilitas').value.trim();
            
            if (!nama) return showToast('Nama ruangan wajib diisi!', 'error');

            const payload = { 
                nama_ruangan: nama,
                kapasitas: parseInt(kapasitas) || 0,
                fasilitas: fasilitas
            };

            let error;
            if (id) {
                // Proses Edit (Update)
                const res = await supabaseClient.from('ruangan').update(payload).eq('id', id);
                error = res.error;
            } else {
                // Proses Tambah (Insert)
                const res = await supabaseClient.from('ruangan').insert([payload]);
                error = res.error;
            }

            if (error) {
                showToast('Gagal menyimpan ruangan: ' + error.message, 'error');
            } else {
                showToast('Ruangan berhasil disimpan!', 'success');
                tutupModalRuangan();
                loadRuangan(); // Segarkan tabel
            }
        }

        // 3. Edit Data (Tampilkan ke Form)
        async function editRuangan(id) {
            const { data, error } = await supabaseClient.from('ruangan').select('*').eq('id', id).single();
            if (error) {
                showToast('Data ruangan tidak ditemukan', 'error');
                return;
            }
            
            document.getElementById('ruangId').value = data.id;
            document.getElementById('ruangNama').value = data.nama_ruangan;
            document.getElementById('ruangKapasitas').value = data.kapasitas || 0;
            document.getElementById('ruangFasilitas').value = data.fasilitas || '';
            
            document.getElementById('modalRuanganTitle').innerText = 'Edit Ruangan';
            document.getElementById('modalRuangan').classList.remove('hidden');
            document.getElementById('modalRuangan').classList.add('flex');
        }

        // 4. Hapus Data
        async function hapusRuangan(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus ruangan ini?')) return;

            const { error } = await supabaseClient.from('ruangan').delete().eq('id', id);
            
            if (error) {
                showToast('Gagal menghapus ruangan', 'error');
            } else {
                showToast('Ruangan berhasil dihapus', 'success');
                loadRuangan();
            }
        }
    </script>
</body>
</html>
